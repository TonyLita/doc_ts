<!-- Le bouton est le switch : sa pastille glisse et porte l'icône du mode actif (lune en sombre, soleil en clair). -->
<button
  type="button"
  role="switch"
  [attr.aria-label]="'commun.theme.nom_accessible' | transloco"
  [attr.aria-checked]="theme.isLight()"
  (click)="theme.toggle()"
  class="relative flex h-full w-16 items-center rounded-full border border-line bg-surface shadow-md focus:ring-2 focus:ring-accent focus:ring-offset-2 focus:ring-offset-surface focus:outline-none"
>
  <!-- Le mode actif reste annoncé aux lecteurs d'écran. -->
  <span class="sr-only">{{
    (theme.isLight() ? 'commun.theme.mode_clair' : 'commun.theme.mode_sombre') | transloco
  }}</span>

  <span
    class="absolute top-1/2 left-0.5 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-primary text-on-primary shadow transition-transform"
    [class.translate-x-[28px]]="theme.isLight()"
    aria-hidden="true"
  >
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      [attr.data-icone]="theme.isLight() ? 'soleil' : 'lune'"
    >
      @if (theme.isLight()) {
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      } @else {
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      }
    </svg>
  </span>
</button>
