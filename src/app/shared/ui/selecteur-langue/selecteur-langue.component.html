<!-- Liste déroulante native : accessible au clavier et aux lecteurs d'écran. Chaque langue est écrite dans sa propre langue. -->
<div class="relative flex h-full items-center">
  <select
    [attr.aria-label]="'commun.langue.titre' | transloco"
    (change)="choisir($event)"
    class="h-full appearance-none rounded-full border border-line bg-surface pr-10 pl-4 text-sm font-semibold text-on-surface shadow-md focus:ring-2 focus:ring-accent focus:ring-offset-2 focus:ring-offset-surface focus:outline-none"
  >
    @for (langue of langues; track langue) {
      <option
        [value]="langue"
        [attr.lang]="langue"
        [selected]="serviceLangue.langueActive() === langue"
        class="bg-surface text-on-surface"
      >
        {{ nomsLangues[langue] }}
      </option>
    }
  </select>
  <svg
    class="pointer-events-none absolute right-3 h-4 w-4 text-on-surface"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polyline points="6 9 12 15 18 9" />
  </svg>
</div>
